name: Deploy site

# Builds app/ (React + Vite) and publishes app/dist to GitHub Pages.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
#
# The refresh jobs push their data commits with GITHUB_TOKEN, and those pushes
# do NOT trigger `on: push` workflows, so this also runs whenever a refresh
# job finishes. That's how fresh closure data reaches the live map.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yaml"
  workflow_run:
    workflows: ["Refresh pathway closures", "Refresh SF closures"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a refresh, only deploy if it succeeded (a failed refresh leaves data untouched anyway).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main   # latest main, including the refresh job's data commit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
