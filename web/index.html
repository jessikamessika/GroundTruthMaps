<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calgary Cycling Closures Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #map { position: absolute; inset: 0; }

  /* Legend + layer toggles (bottom sheet, collapsible) */
  #panel {
    position: absolute; z-index: 2;
    left: 8px; right: 8px;
    bottom: calc(30px + env(safe-area-inset-bottom));
    max-width: 420px;
    background: rgba(255,255,255,0.96); color: #1a1a1a;
    border-radius: 11px; box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    font: 14px/1.4 system-ui, sans-serif;
  }
  #panel-toggle {
    width: 100%; box-sizing: border-box; min-height: 44px;
    padding: 0 14px; border: 0; background: none; color: inherit;
    font: inherit; font-weight: 600; text-align: left; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  #panel-body { padding: 0 14px 8px; }
  #panel.collapsed #panel-body { display: none; }
  #panel-toggle .chev { transition: transform .15s; }
  #panel.collapsed #panel-toggle .chev { transform: rotate(180deg); }

  .row {
    display: flex; align-items: center; gap: 10px;
    min-height: 40px; cursor: pointer;
  }
  .row.static { cursor: default; }
  .row input { width: 20px; height: 20px; margin: 0; flex: none; }
  .row .spacer { width: 20px; flex: none; }
  .swatch { width: 22px; height: 4px; border-radius: 2px; flex: none; }

  /* Freshness pill */
  #updated {
    position: absolute; z-index: 2; left: 8px;
    top: calc(8px + env(safe-area-inset-top));
    background: rgba(255,255,255,0.96); color: #1a1a1a;
    padding: 6px 10px; border-radius: 999px;
    font: 12px/1.2 system-ui, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  #updated.stale { background: #fef3c7; color: #78350f; }
  #updated:empty { display: none; }
  /* Network loading indicator (sits just below the freshness pill) */
  #loading {
    position: absolute; z-index: 2; left: 8px;
    top: calc(40px + env(safe-area-inset-top));
    background: rgba(255,255,255,0.96); color: #1a1a1a;
    padding: 6px 10px; border-radius: 999px;
    font: 12px/1.2 system-ui, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  #loading[hidden] { display: none; }


  /* Load-failure banner */
  #error {
    position: absolute; z-index: 3; left: 8px; right: 8px;
    top: calc(44px + env(safe-area-inset-top));
    background: #fef2f2; color: #7f1d1d; border: 1px solid #fecaca;
    padding: 10px 12px; border-radius: 8px;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #error:empty { display: none; }

  .maplibregl-popup-content {
    font: 14px/1.5 system-ui, sans-serif; max-width: 240px;
    padding: 12px 28px 12px 12px;
  }
  .maplibregl-popup-close-button { font-size: 22px; width: 32px; height: 32px; }
  .maplibregl-ctrl-top-right { top: env(safe-area-inset-top); }
</style>
</head>
<body>
<div id="map"></div>
<div id="updated"></div>
<div id="loading" hidden>Loading cycling network…</div>
<div id="error" role="alert"></div>

<div id="panel">
  <button id="panel-toggle" aria-expanded="true">
    <span>Legend and layers</span><span class="chev">▾</span>
  </button>
  <div id="panel-body">
    <label class="row">
      <input type="checkbox" id="t-network" checked>
      <span class="swatch" style="background:#7a8ca5"></span> Cycling network
    </label>
    <label class="row">
      <input type="checkbox" id="t-unconfirmed" checked>
      <span class="swatch" style="background:#7a8ca5;opacity:0.5"></span> Unconfirmed paths
    </label>
    <label class="row">
      <input type="checkbox" id="t-current" checked>
      <span class="swatch" style="background:#e11d48"></span> Closed now
    </label>
    <label class="row">
      <input type="checkbox" id="t-future" checked>
      <span class="swatch" style="background:#e11d48;opacity:0.35"></span> Closed (upcoming)
    </label>
    <label class="row">
      <input type="checkbox" id="t-detour" checked>
      <span class="swatch" style="background:#16a34a"></span> Detour
    </label>
  </div>
</div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-114.0719, 51.0447],
  zoom: 11,
  attributionControl: {
    compact: true,
    customAttribution:
      '© OpenStreetMap contributors (ODbL) · ' +
      'City of Calgary Open Data (Open Government Licence - Calgary)'
  }
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true,
  showUserLocation: true
}), 'top-right');

// Collapsible panel; start collapsed on small screens so the map is visible.
const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panel-toggle');
function setCollapsed(c) {
  panel.classList.toggle('collapsed', c);
  panelToggle.setAttribute('aria-expanded', String(!c));
}
panelToggle.addEventListener('click', () =>
  setCollapsed(!panel.classList.contains('collapsed')));
if (window.matchMedia('(max-width: 600px)').matches) setCollapsed(true);

// Build a popup DOM tree without innerHTML — closure text comes from an
// external feed (City ArcGIS `CLOSURE_DETOUR` etc.), so it must not be
// interpreted as markup.
function buildClosurePopup(props) {
  const when = props.calgary_temporal_status === 'FUTURE'
    ? `Starts ${props.start_date || 'date TBD'}`
    : `Since ${props.start_date || 'unknown'}${props.end_date ? ' — expected until ' + props.end_date : ''}`;

  const root = document.createElement('div');

  const heading = document.createElement('strong');
  heading.textContent = props.status === 'detour' ? 'Detour' : 'Closed';
  root.appendChild(heading);

  root.appendChild(document.createElement('br'));

  if (props.detour_note) {
    root.appendChild(document.createTextNode(props.detour_note));
    root.appendChild(document.createElement('br'));
  }

  const em = document.createElement('em');
  em.textContent = when;
  root.appendChild(em);

  return root;
}

function showError(msg) {
  document.getElementById('error').textContent = msg;
}

function showUpdated(generated) {
  const d = new Date(generated);
  if (!generated || isNaN(d)) return;   // no valid date, no pill
  const el = document.getElementById('updated');
  const hasTime = /T\d{2}:\d{2}/.test(generated);

  function render() {
    if (!hasTime) {   // old date-only format: don't fake precision
      el.textContent = 'Closures updated ' +
        d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      return;
    }
    const mins = Math.max(0, Math.round((Date.now() - d) / 60000));
    let ago;
    if (mins < 1) ago = 'just now';
    else if (mins < 60) ago = `${mins} min ago`;
    else if (mins < 48 * 60) {
      const h = Math.round(mins / 60);
      ago = `${h} hour${h === 1 ? '' : 's'} ago`;
    } else ago = `${Math.round(mins / 1440)} days ago`;
    el.textContent = `Closures updated ${ago}`;
    el.classList.toggle('stale', mins > 6 * 60);
  }
  render();
  setInterval(render, 60000);
}

// Show/hide layers; ignore layers that haven't loaded yet.
function setVis(ids, on) {
  ids.forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
  });
}
// Wire a checkbox; returns a function that re-applies its state later.
function wireToggle(checkboxId, layerIds) {
  const cb = document.getElementById(checkboxId);
  cb.addEventListener('change', () => setVis(layerIds, cb.checked));
  return () => setVis(layerIds, cb.checked);
}

const CLOSURE_LAYERS = ['closures-current', 'closures-future', 'closures-detour'];

map.on('load', async () => {
  const loading = document.getElementById('loading');

  // 1. Closures first: small, and the point of the app
  try {
    const r = await fetch('../data/closures.geojson');
    if (!r.ok) throw new Error('closures HTTP ' + r.status);
    const closures = await r.json();
    showUpdated(closures.generated);
    map.addSource('closures', { type: 'geojson', data: closures });
  } catch (err) {
    console.error(err);
    showError('Could not load closure data. Check your connection and reload.');
    loading.hidden = true;
    return;
  }

  map.addLayer({ id: 'closures-current', type: 'line', source: 'closures',
    filter: ['all', ['==', ['get', 'status'], 'closed'], ['==', ['get', 'calgary_temporal_status'], 'CURRENT']],
    paint: { 'line-color': '#e11d48', 'line-width': 4 } });
  map.addLayer({ id: 'closures-future', type: 'line', source: 'closures',
    filter: ['all', ['==', ['get', 'status'], 'closed'], ['==', ['get', 'calgary_temporal_status'], 'FUTURE']],
    paint: { 'line-color': '#e11d48', 'line-width': 4, 'line-opacity': 0.4, 'line-dasharray': [2, 2] } });
  map.addLayer({ id: 'closures-detour', type: 'line', source: 'closures',
    filter: ['==', ['get', 'status'], 'detour'],
    paint: { 'line-color': '#16a34a', 'line-width': 4 } });

  wireToggle('t-current', ['closures-current']);
  wireToggle('t-future', ['closures-future']);
  wireToggle('t-detour', ['closures-detour']);
  const tNetwork = document.getElementById('t-network');
  const tUnconfirmed = document.getElementById('t-unconfirmed');

  function updateNetworkVis() {
    const net = tNetwork.checked;
    setVis(['network-confirmed'], net);
    setVis(['network-unconfirmed'], net && tUnconfirmed.checked);
    tUnconfirmed.disabled = !net;   // greyed out when the whole network is hidden
  }
  tNetwork.addEventListener('change', updateNetworkVis);
  tUnconfirmed.addEventListener('change', updateNetworkVis);

  // Fat-finger tolerance: query a box around the tap instead of a single
  // pixel, since closure lines are thin. Only visible layers return features.
  const HIT = 10;
  function closuresNear(point) {
    return map.queryRenderedFeatures(
      [[point.x - HIT, point.y - HIT], [point.x + HIT, point.y + HIT]],
      { layers: CLOSURE_LAYERS }
    );
  }

  // Distance in screen pixels from point p to segment a-b
  function segDist(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2)) : 0;
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }

  // Of the features in the hit box, return the one whose line is nearest the tap
  function nearestFeature(point, feats) {
    let best = feats[0], bestD = Infinity;
    for (const f of feats) {
      const g = f.geometry;
      const lines = g.type === 'LineString' ? [g.coordinates]
                  : g.type === 'MultiLineString' ? g.coordinates : [];
      for (const line of lines) {
        for (let i = 0; i < line.length - 1; i++) {
          const d = segDist(point, map.project(line[i]), map.project(line[i + 1]));
          if (d < bestD) { bestD = d; best = f; }
        }
      }
    }
    return best;
  }

  map.on('click', (e) => {
    const hits = closuresNear(e.point);
    if (!hits.length) return;
    new maplibregl.Popup({ maxWidth: '240px' })
      .setLngLat(e.lngLat)
      .setDOMContent(buildClosurePopup(nearestFeature(e.point, hits).properties))
      .addTo(map);
  });

  // Pointer cursor on desktop (no-op on touch)
  map.on('mousemove', (e) => {
    map.getCanvas().style.cursor = closuresNear(e.point).length ? 'pointer' : '';
  });

  // 2. Network in the background, inserted beneath the closure layers
  loading.hidden = false;
  try {
    const r = await fetch('../data/network.geojson');
    if (!r.ok) throw new Error('network HTTP ' + r.status);
    const network = await r.json();
    map.addSource('network', { type: 'geojson', data: network });
    map.addLayer({ id: 'network-confirmed', type: 'line', source: 'network',
      filter: ['==', ['get', 'bicycle_access'], 'designated'],
      paint: { 'line-color': '#7a8ca5', 'line-width': 1.5, 'line-opacity': 0.7 } }, 'closures-current');
    map.addLayer({ id: 'network-unconfirmed', type: 'line', source: 'network',
      filter: ['!=', ['get', 'bicycle_access'], 'designated'],
      paint: { 'line-color': '#7a8ca5', 'line-width': 1.2, 'line-opacity': 0.4 } }, 'closures-current');
    updateNetworkVis();   // honor checkboxes toggled while loading  } catch (err) {
    console.error(err);
    showError('Closures loaded, but the cycling network could not be loaded.');
  } finally {
    loading.hidden = true;
  }

});
</script>
</body>
</html>
